name: keepalive

# github pauses schedules after 60 days without commits
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          date -u +%F > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898277+github-actions[bot]@users.noreply.github.com"
          git commit -am "keep alive"
          git push
